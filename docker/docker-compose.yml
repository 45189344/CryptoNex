version: '3.8'

services:
  # 1. PostgreSQL Forensic Database
  postgres:
    image: postgres:16-alpine
    container_name: cryptonex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptonex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql
    networks:
      - cryptonex-net

  # 2. Neo4j Graph Database
  neo4j:
    image: neo4j:5.18-community
    container_name: cryptonex-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    networks:
      - cryptonex-net

  # 3. Python FastAPI Analytics & ML Service
  analytics:
    build:
      context: ../analytics
      dockerfile: ../docker/Dockerfile.analytics
    container_name: cryptonex-analytics
    restart: unless-stopped
    environment:
      ANALYTICS_PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - cryptonex-net

  # 4. Node.js Backend API
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: cryptonex-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - neo4j
      - analytics
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cryptonex
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      ANALYTICS_SERVICE_URL: http://analytics:8000
    ports:
      - "5000:5000"
    networks:
      - cryptonex-net

  # 5. Frontend React + Vite Web Application
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: cryptonex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - cryptonex-net

volumes:
  postgres_data:
  neo4j_data:

networks:
  cryptonex-net:
    driver: bridge
